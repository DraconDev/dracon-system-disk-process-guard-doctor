# Dracon System Guard Policy
# Path: ~/.dracon/utilities/system/dracon-system.toml
#
# Controls disk monitoring, process protection, and auto-cleanup.
#
# ===========================================================================
# RANGES ARE ENFORCED IN CODE — the comments below are not just prose
# ===========================================================================
# Every numeric knob documented here has a legal range, and that range is
# ENFORCED, not merely suggested. The enforcing code is the function
# `normalize_guard_policy` in src/policy.rs (search for it; the line number
# moves as this file grows), called from `SystemPolicy::normalize` in the
# same file, which `parse_system_policy` in src/main.rs invokes at the policy
# load boundary. Every consumer — daemon, doctor, setup, links, relocate,
# quarantine, storage — therefore receives in-range values by construction.
#
# ADDED 2026-09-29 (audit DECIDE #8 follow-up): until then the ranges below
# existed only as comments, and nine of the eleven policy load sites never
# normalized at all, so a nonsense threshold reached relocate, quarantine and
# storage raw.
#
# Two behaviours, both deliberate:
#
#   CLAMPED — the value would make the daemon malfunction, so it is moved
#     into range and the guard keeps running. It is reported on stderr:
#       ⚠ policy: out-of-range value(s) clamped to their legal range: <fields>
#     A clamp in the journal means this file needs fixing; the guard is
#     running on the clamped value, not yours.
#     The report is emitted once per DISTINCT set, not once per load: the
#     guard re-reads the policy every pass, so a per-load report would emit
#     the same line ~5,760 times a day at the default 30 s interval. A new
#     process reports again, and a fix is confirmed rather than inferred from
#     silence:
#       ✓ policy: all values now in range (previously clamped: <fields>)
#
#   NOT CLAMPED (0 is meaningful) — several knobs treat 0 as "disabled" and
#     are left exactly as written. A floor on those would silently RE-ARM a
#     feature you deliberately turned off, which is worse than the mistake it
#     was meant to prevent. Those are: trend_warn_hours, zombie_threshold,
#     log_size_mb, node_modules_max_age_days, tmp_min_age_hours,
#     trash_min_age_days, rust_target_action_min_age_days,
#     quarantine_ttl_days,
#     reap_report_min_idle_hours, reap_report_max_cpu_seconds,
#     nix_keep_generations, relocate_min_age_days. The list is pinned by a
#     test (`sentinel_zero_knobs_are_never_clamped`) so it cannot drift.
#
#   NOT LISTED ABOVE, but still bounded: cap_offenders_cpu_percent has a
#     CEILING of 100 (this knob is a cap on a percentage of ONE CPU, so a
#     systemd-style 400% value is clamped to 100); notify_cooldown_secs has a
#     floor of 5 and a ceiling of 86400 (a huge value would make the cooldown
#     cutoff subtraction overflow, and in practice disables notification
#     pruning); unfreeze_below_percent, disk_early_warn_percent and every other
#     percent threshold are banded 1..100, because 0 means "match every sample"
#     (or, for unfreeze, "never lift the freeze").
#
# Floats accept TOML `nan` and `inf` literals; those are scrubbed too, since
# a NaN fails every comparison and would silently disable its own threshold.
#
# ---------------------------------------------------------------------------
# UNKNOWN KEYS ARE REPORTED, NOT REJECTED
# ---------------------------------------------------------------------------
# A key this binary does not recognise — a typo, or a knob written under the
# wrong table header — is IGNORED for behaviour but NAMED on stderr:
#
#   ⚠ policy: 2 unknown key(s) in ~/.dracon/.../dracon-system.toml ignored:
#   guard.disk_warn_persent — did you mean disk_warn_percent?;
#   storage.cleanup_min_size_mb — `cleanup_min_size_mb` belongs under [guard]
#
# The daemon still starts and still applies every key it does understand: a
# stray key is a configuration mistake, not a reason to refuse to run a
# monitoring service. What it must never be is silent — a misspelled knob
# used to look configured and was ignored, which is how a tightened
# threshold or a disabled cleanup stays in force for months.
#
# The accepted key list is derived from the policy structs themselves, so a
# knob added to the binary is accepted here automatically; it is never a
# hand-maintained list that can drift.
# ===========================================================================
#
# NOTE: this example is intentionally stricter (more report-only) than the
# compiled defaults. Thresholds here (65/75/85/92, unfreeze 70) sit below the
# code defaults (70/80/90/95, unfreeze 88), and the cleanup kinds below
# default to false while the code defaults them to true. A machine running
# with NO config file therefore cleans more aggressively (gated only by
# auto_cleanup_apply=false); copying this file opts into the gentler posture.

[guard]
# Enable the guard daemon
enabled = true

# Seconds between guard check cycles
# interval_secs = 30

# Disk mount point to monitor (default: /nix on NixOS, / otherwise)
# disk_mount_path = "/nix"

# Disk usage thresholds (percent)
# Lower values = more aggressive early cleaning
disk_early_warn_percent = 65
disk_warn_percent = 75
disk_action_percent = 85
disk_critical_percent = 92

# Report disk pressure without pausing dracon-sync.
# Automatic synchronization freezes are intentionally disabled by default.
freeze_sync_at_action = false
# Marker file the guard creates while frozen (default
# ~/.dracon/dracon-sync.freeze). dracon-sync watches this path.
# sync_freeze_marker = "~/.dracon/dracon-sync.freeze"

# Unfreeze sync when disk drops below this level (set to ~warn_percent)
unfreeze_below_percent = 70

# Process monitoring thresholds
process_cpu_percent = 50.0      # Alert if CPU > 50%
process_rss_mb = 4096           # Alert if RSS > 4GB
process_sustain_secs = 30       # Alert after 30s sustained

# Processes to exclude from monitoring (comma-separated)
process_exempt_names = "systemd,dbus-daemon,Xorg,kwin_wayland,plasmashell,dracon-code"

# Auto-renice heavy processes (graduated: higher CPU/memory = higher nice value)
# CPU tiers: >=180% → nice 5, >=300% → nice 10, >=500% → nice 15
# Memory tiers: >=4GB → nice 5, >=8GB → nice 10
# Tier values are floors: an already nicer process is never raised in priority.
# renice_value is the fallback nice when no CPU/memory tier threshold is met
# Report sustained CPU-heavy processes; do not change priorities by default.
auto_renice = false
# nice value, enforced to 0-19 (the POSIX range). Below 0 the guard would
# try to RAISE an offender's priority, inverting the tier-floor promise
# above; above 19 the renice exec fails. See normalize_guard_policy.
renice_value = 5
release_after_secs = 120     # Un-renice after 2 min of being non-heavy.
                            # Floor 5s: 0 would un-renice on the very next
                            # pass, renicing and restoring every cycle.

# Notifications
# notify_command must be an absolute path (e.g. /usr/bin/notify-send).
# Arguments are supported, so `notify-send -u critical` works without a
# wrapper script. The value is split into a program and an argv array and
# executed directly — no shell is involved, so `;`, `|`, `$(...)`, backticks
# and globs are inert characters, never syntax. Quoting follows shell rules
# (single quotes, double quotes, backslash escapes); an unterminated quote is
# rejected rather than mis-parsed. The notification title and body are
# appended after your arguments, which is the order notifiers expect.
# The program may not be a shell, a privilege escalator, or an argument
# pass-through wrapper — `sh`, `bash`, `dash`, `zsh`, `ksh`, `csh`, `fish`,
# `busybox`, `sudo`, `su`, `doas`, `pkexec`, `env`, `xargs`, `nohup`,
# `setsid`, `nice`, `ionice`, `timeout`, `watch`, `systemd-run` and friends
# are refused. This is not new policy: before argument support existed the
# whole string was used as one path, so `sh -c ...` failed only because that
# string was not a file. Point notify_command at a notifier binary.
# Enforcement: `NotifyCommand::parse` in src/policy.rs.
notify = true
notify_command = "/usr/bin/notify-send"
notify_cooldown_secs = 300
# Repeat unchanged structured reports no more often than every 30 minutes.
report_repeat_secs = 1800

# Persistent logging of heavy processes (`~` expands to the service user's home)
# Non-empty relative paths resolve from the process working directory; the
# shipped user service sets WorkingDirectory=%h for a stable relative base.
guard_log_file = "~/.local/state/dracon/dracon-system-guard.log"
# Floor 1 MiB. NOTE 0 does NOT mean "unlimited" — rotation returns early on
# a 0 cap, so 0 silently disables rotation and the event log grows until the
# disk guard notices. Use a large value for "effectively unlimited".
guard_log_max_mb = 1

# Auto-cleanup Rust target directories when disk is full
# ⚠️ auto_cleanup_apply must be true for the daemon to actually delete files.
# When false (default), the daemon only logs what it would clean.
auto_cleanup_rust = true
auto_cleanup_apply = false
# Bound action-level dry-run scans to once every 30 minutes.
auto_cleanup_interval_secs = 1800
# Floor 1 MiB: 0 would make every Rust target — including an empty one — a
# cleanup candidate.
cleanup_min_size_mb = 256
rust_search_roots = "~/Dev"

# Proactive cleanup scans begin at 80% disk usage and run hourly.
proactive_cleanup_percent = 80
proactive_cleanup_interval_cycles = 120

# Auto-cleanup old node_modules
node_modules_search_roots = "~/Dev"
# Days before an unused node_modules is a candidate (0 disables).
node_modules_max_age_days = 30

# Additional protected paths (besides system defaults)
# protected_paths = ["/mnt/data", "/opt/important"]

# Monitor inode usage
monitor_inodes = true
# Enforced to 1-100. Above 100 the alert can never fire, silently disabling
# the monitor you enabled here.
inode_warn_percent = 85

# Monitor zombie processes (diagnostic only; zombies cannot be killed directly).
# Alert when the count exceeds this (0 disables the alert).
monitor_zombies = true
zombie_threshold = 20

# Memory pressure requires persistence and active pressure signals.
monitor_memory = true
mem_available_warn_percent = 10
swap_used_warn_percent = 50
mem_psi_full_warn = 10.0
# Swap-in velocity (pages/s) at or above which the guard reads thrashing,
# independent of PSI — violent swap-in with moderate PSI is the classic
# thrash signature. Healthy ~0/s, thrashing six digits.
mem_swapin_warn_pages_per_sec = 1000
memory_pressure_sustain_secs = 120
auto_renice_on_memory = true
bias_oom_on_pressure = true
cap_offenders_cpu_percent = 0

# Monitor large log files
# log_dirs is a comma-separated list; `~` expands to the service user's
# home. There are three states, and they are deliberately distinguishable:
#
#   OMITTED  — scan the default, ~/.local/state/dracon. This is the guard's
#               own state directory: it always exists where the daemon runs,
#               it is inside the unit's ReadWritePaths (so auto_truncate_logs
#               can reclaim there), and it holds the guard's own event log —
#               the one log whose growth the guard most needs to notice.
#               Log-size monitoring therefore works with no configuration.
#   SET      — scan exactly the directories you list.
#   BLANK    — `log_dirs = ""` disables the check. An explicitly blank value
#               is honoured as "off"; it is not the same as omitting the key.
#
# A configured directory that does not exist is now REPORTED on stderr
# instead of being dropped silently, so a wrong path cannot look the same
# as monitoring being off.
monitor_logs = true
# Alert on files at or above this size in MiB (0 disables).
log_size_mb = 100
# NOTE on /var/log: the shipped dracon-system-guard.service does NOT grant
# it in ReadWritePaths. Under ProtectSystem=strict + ProtectHome=read-only
# the write-mode open in truncate_log_file fails EROFS, so auto_truncate_logs
# on /var/log logs "failed to truncate" and reclaims nothing (audit F94).
# Scanning /var/log read-only is fine; truncating it is not. To truncate it
# you must run dracon-system outside the unit, or add /var/log to
# ReadWritePaths yourself — an unprivileged user service cannot do that
# under the shipped hardening. Leave log_dirs unset for the default; set it
# to "" to switch the check off.
# log_dirs = "/var/log"          # example of an explicit list
auto_truncate_logs = false
log_max_truncate_mb = 50
# Floor 1 MiB. Capped at 10,000 lines: the preserve step reads this many
# lines into memory, so an unbounded value is a memory-exhaustion vector on
# a multi-gigabyte log. 0 = preserve no header (allowed).
log_preserve_header_lines = 0   # Lines to preserve when truncating logs

# Docker cleanup
# Broad cleanup is report-only unless explicitly requested.
docker_prune = false
docker_prune_volumes = false
# `docker system prune --all` also deletes every unused image, not just
# dangling ones. Off by default: the daemon (auto_cleanup_apply) prunes
# dangling layers only unless you opt in here. The `guard clean --all`
# CLI flag is separate and still honoured.
docker_prune_all = false

# Package cache cleanup. Dry-run estimates skip caches used by active
# cargo/rustc, npm, pip, or go (including common wrappers). Apply intentionally
# refuses package-cache deletion until a shared manager/guard lock exists.
clean_package_caches = false
clean_trash = false
clean_nix_garbage = false
nix_keep_generations = 5            # Generations to retain (0 keeps none — deletes everything prunable).

# ADDED 2026-09-09 (audit F48): knobs that exist in code with live defaults
# but were undocumented here. Several default TRUE — copying this file
# without setting them leaves those cleanups armed (gated only by
# auto_cleanup_apply=false above). Commented lines show code defaults.
# node_modules age cleanup (default TRUE — see M3 note in policy.rs).
clean_node_modules = false
# /tmp top-level age hygiene (code default TRUE; v0.112.39 — 207 GiB
# incident). False here to match this file's gentler posture.
clean_tmp = false
# tmp_search_paths = "/tmp"          # comma-separated roots; only /tmp
                                      # (or descendants) are accepted
# tmp_min_age_hours = 24              # only entries older than this (0 disables tmp hygiene)
# Trash recovery window (default 7 — 0 restores empty-everything).
# trash_min_age_days = 7              # days before trash is purged (0 purges immediately)
# Refuse to purge trash entries whose names look credential-bearing
# (default TRUE).
# trash_credential_guard = true
# Stuck-process threshold (default 600s; must be >= process_sustain_secs).
# process_stuck_after_secs = 600
# Report-only abandoned dev/test process worklist (never signals or kills;
# see reap.rs). A process is listed only when ALL hold: sleeping, no
# controlling terminal, lifetime CPU under the ceiling, older than the
# idle floor, command line matches a signature, not in
# process_exempt_names above.
# reap_report_min_idle_hours = 24   # hours old before listing (0 lists everything idle)
# reap_report_max_cpu_seconds = 60  # lifetime CPU ceiling for "idle" (0 lists only never-ran)
# reap_report_signatures = "eve web,vite,playwright,chromium,bun run,bun test,npm run test,.mjs,litestream,stub-auth-api"
# DESTRUCTIVE opt-in (default false): re-verify every listed candidate live
# at kill time (same bar as above, plus a starttime check against PID
# reuse) and SIGTERM/SIGKILL what still verifies. Kills AND skips are
# recorded in the report's `reaped` array and echoed to stderr.
# reap_stale_dev_servers = false
# Rapid-fill trip rate in GiB/hour (default 20.0).
# disk_rapid_fill_gbph = 20.0
# Rust target age gates (2026-09-14: action tier used to delete ANY target
# above min size with only a 60s mtime backstop, thrashing daily drivers).
# Proactive tier (disk >= proactive_cleanup_percent): only targets older
# than this.
# rust_target_max_age_days = 14
# Action/critical tier: only targets untouched for this long (default 7
# days). A just-rebuilt target is fresh by definition, so this doubles as
# a re-clean cooldown. 0 disables the gate (old delete-anything posture).
# rust_target_action_min_age_days = 7

# Disk trend prediction
track_trends = true
# Warn when the trend says the disk fills within this many hours (0 disables).
trend_warn_hours = 24

# ADDED 2026-09-26 (space tiers, Phase 1): extra mounts reported alongside
# the primary mount (comma-separated). Visibility only: cleanup and freeze
# decisions still key off the primary mount.
# disk_extra_mounts = "/mnt/data"

# ADDED 2026-09-26 (space tiers, Phase 1): quarantine root for
# hold-then-delete staging (`quarantine move/list/restore/expire`).
# quarantine_dir = "~/.local/share/dracon/quarantine"
# Quarantine TTL in days; `expire` deletes older entries, 0 disables expiry.
# quarantine_ttl_days = 30
#
# Unattended expiry cadence in seconds (code default 86400 = daily; 0 opts
# out entirely). The daemon pass ALSO requires clean_quarantine_first AND
# auto_cleanup_apply=true to actually delete — with apply=false it only
# reports what would expire (audit M5, 2026-10-02).
# quarantine_expire_interval_secs = 86400
#
# Every entry carries a `.quarantine.json` manifest recording where it came
# from. An entry whose manifest cannot be read is NEVER expired, at any TTL
# and never with --apply: without the manifest there is no record of where it
# went, so deleting it turns "held, recoverable by hand" into "gone". The
# quarantine root is written only by the guard, so an unreadable manifest
# means corruption, not a routine condition a TTL should bound; a genuinely
# transient read error clears itself and the entry then ages normally.
# Such entries are marked PINNED in `quarantine list`, counted in
# `quarantine expire`, and carried in the --json `pinned` array — the pin is
# never silent. The operator escape hatch is
# `quarantine purge <name> --apply` for ONE entry they have inspected; it is
# never a bulk sweep of everything unreadable.

# ADDED 2026-09-27 (space tiers, Phase 2): daemon rust-target and
# node_modules cleanup moves candidates to quarantine instead of deleting.
# Explicit `guard clean` always deletes. Default off.
# clean_quarantine_first = false

# ADDED 2026-09-27 (space tiers, Phase 2): automatic cold relocation at
# action/critical — move big idle dirs to the cold root BEFORE deleting
# anything rebuildable. Report-only unless auto_relocate_apply. Tracked
# content is never a candidate (no override in auto mode).
# auto_relocate = true
# auto_relocate_apply = false
# relocate_candidate_roots = "~/Dev"
# relocate_cold_root = "/mnt/data/cold"
# relocate_min_size_mb = 2048
# relocate_min_age_days = 14      # idle days before a candidate (0 allows fresh dirs)
# relocate_max_moves_per_pass = 3

# Storage hotspot analysis (`storage` command). default_root is scanned
# when no root argument is passed; kinds selects hotspot classes.
# [storage]
# default_root = "/home/dracon/Dev"
# min_size_mb = 512              # Floor 1 MiB: 0 would make every file,
                                 # including empty ones, a hotspot candidate.
# kinds = "rust-build,node-deps,build-output,cache"

# Managed symlinks (`link status` / `link apply`). Each entry keeps the
# link path pointed at its target, repairing drift.
# [[links.entries]]
# link = "/home/dracon/Dev/dracon-strategy/ai-auto-video/example_output"
# target = "/mnt/data/cold/example_output"
